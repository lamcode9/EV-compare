name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  # The production build is verified by Vercel on every push to `main` (it builds
  # with the real DATABASE_URL as part of the deploy). A second CI build here is
  # redundant and can't reach a database without copying the prod secret into
  # GitHub, so it's intentionally omitted. Re-add a `build` job with a
  # DATABASE_URL secret if a pre-deploy build gate is wanted in CI.
